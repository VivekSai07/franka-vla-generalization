services:

  # ─────────────────────────────────────────────────────────────────────────────
  # collect — run dataset collection with MuJoCo simulation
  # Usage: docker compose run --rm collect
  # To enter interactively: docker compose run --rm collect bash
  # ─────────────────────────────────────────────────────────────────────────────
  collect:
    build: .
    image: smolvla:latest
    user: "1001:1001"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display
      - MUJOCO_GL=osmesa
      - HOME=/vla
      - TORCHINDUCTOR_CACHE_DIR=/vla/.torch_cache/inductor
    volumes:
      - .:/vla
    env_file: .env
    working_dir: /vla
    command: python data_collection/collect_libero_dataset.py --episodes 300 --headless

  # ─────────────────────────────────────────────────────────────────────────────
  # push — upload a local dataset to the HuggingFace Hub
  # Usage: docker compose run --rm push
  # ─────────────────────────────────────────────────────────────────────────────
  push:
    build: .
    image: smolvla:latest
    user: "1001:1001"
    volumes:
      - .:/vla
    environment:
      - HF_HOME=/vla/.hf_cache
      - TORCHINDUCTOR_CACHE_DIR=/vla/.torch_cache/inductor
      - HOME=/vla
    env_file: .env
    working_dir: /vla
    command: python huggingface/push_dataset_to_hub.py

  # ─────────────────────────────────────────────────────────────────────────────
  # train — fine-tune SmolVLA on the franka_libero_stacking dataset
  # Usage: docker compose run --rm train
  # ─────────────────────────────────────────────────────────────────────────────
  train:
    build: .
    image: smolvla:latest
    user: "1001:1001"
    runtime: nvidia
    shm_size: '8gb'
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/vla/.hf_cache
      - TORCHINDUCTOR_CACHE_DIR=/vla/.torch_cache/inductor
      - HOME=/vla
    volumes:
      - .:/vla
    env_file: .env
    working_dir: /vla
    command:
      bash -c "
        OUT=outputs/train/smolvla_franka_libero_stacking_finetuned_b32_s80k;
        LAST=$$(ls $$OUT/checkpoints 2>/dev/null | sort -n | tail -1);
        if [ -n \"$$LAST\" ]; then
          echo \"Resuming from checkpoint $$LAST\";
          exec lerobot-train
            --config_path=$$OUT/checkpoints/$$LAST/pretrained_model/train_config.json
            --resume=true;
        else
          exec lerobot-train
            --policy.type=smolvla
            --policy.pretrained_path=HuggingFaceVLA/smolvla_libero
            --dataset.repo_id=${HF_USERNAME}/franka_libero_stacking_v2
            --policy.repo_id=${HF_USERNAME}/smolvla_franka_libero_stacking_finetuned_b32_s80k
            --batch_size=32
            --steps=80000
            --output_dir=$$OUT
            --job_name=franka_libero_stacking_run_b32_s80k
            --policy.device=cuda
            --policy.use_amp=true
            --policy.expert_width_multiplier=0.5
            --wandb.enable=true
            --wandb.project=smolvla_franka_project;
        fi
      "

  # ─────────────────────────────────────────────────────────────────────────────
  # server — SmolVLA inference brain (FastAPI on port 8000)
  # Start this first:  docker compose up server
  # Wait for: "✅ Policy & Processors loaded! Starting inference server..."
  # ─────────────────────────────────────────────────────────────────────────────
  server:
    build: .
    image: smolvla:latest
    user: "1001:1001"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/vla/.hf_cache
      - TORCHINDUCTOR_CACHE_DIR=/vla/.torch_cache/inductor
      - HOME=/vla
    volumes:
      - .:/vla
    env_file: .env
    working_dir: /vla
    ports:
      - "8000:8000"
    command: python inference/policy_server_libero.py --policy_path ${HF_USERNAME}/smolvla_franka_libero_stacking_finetuned_b32_s80k

  # ─────────────────────────────────────────────────────────────────────────────
  # client — MuJoCo simulation body; queries the server for actions
  # Start after server is ready:  docker compose run --rm client
  # Requires X11 display for the MuJoCo viewer window.
  # On the host run:  xhost +local:docker
  # ─────────────────────────────────────────────────────────────────────────────
  client:
    build: .
    image: smolvla:latest
    user: "1001:1001"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display
      - DISPLAY=${DISPLAY}
      - MUJOCO_GL=glx
      - HF_HOME=/vla/.hf_cache
      - TORCHINDUCTOR_CACHE_DIR=/vla/.torch_cache/inductor
      - HOME=/vla
      # client uses network_mode: host, so reach the server via localhost (port mapped to host)
      - SERVER_URL=http://localhost:8000/predict
    volumes:
      - .:/vla
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    env_file: .env
    working_dir: /vla
    depends_on:
      - server
    network_mode: host
    command: python -m inference.franka_inference_libero --episodes 30 --policy_name smolvla_franka_libero_stacking_finetuned_b32_s80k
